<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LanPC</title>
<style>
:root{--ink:#12222b;--glow:#24505a;--deep:#1d3b44;--tbi:#2a4650;--acc:#2c6e73;--acc2:#f0a73a;--acc2t:#2b1c00;--paper:#eef1f1;--tool:#e3e8e8;--field:#fff;--soft:#e3ebeb;--hover:#e0eaea;--line:#c9d2d3;--text:#172126;--mut:#5d6f74;--bar:#0c171d;--bart:#dfe9ea}
html[data-theme=midnight]{--ink:#0a0e1a;--glow:#1c2a55;--deep:#1b2547;--tbi:#151b33;--acc:#5b7cff;--acc2:#7ee0c3;--acc2t:#04241b;--paper:#151a2b;--tool:#1b2136;--field:#0f1322;--soft:#202845;--hover:#1f2744;--line:#2c3556;--text:#e4e9fb;--mut:#8c96bd;--bar:#070a14;--bart:#cfd6f2}
html[data-theme=graphite]{--ink:#17181a;--glow:#34363b;--deep:#2b2d31;--tbi:#222427;--acc:#6c7a89;--acc2:#ff7a45;--acc2t:#2a0d00;--paper:#24262a;--tool:#2c2e33;--field:#1a1b1e;--soft:#33353b;--hover:#2f3136;--line:#3a3d43;--text:#e8e9eb;--mut:#9a9ea6;--bar:#0f1012;--bart:#d5d7da}
html[data-theme=paper]{--ink:#4d6571;--glow:#7a98a6;--deep:#37474f;--tbi:#78909c;--acc:#3f6fb5;--acc2:#e8a33d;--acc2t:#2b1c00;--paper:#fafafa;--tool:#eceff1;--field:#fff;--soft:#e8eef3;--hover:#e3eaf0;--line:#cfd8dc;--text:#1c2428;--mut:#5f6e75;--bar:#263238;--bart:#eceff1}
html[data-theme=forest]{--ink:#10211a;--glow:#1f4a37;--deep:#1c3d2e;--tbi:#29493b;--acc:#3a7d52;--acc2:#e3c15a;--acc2t:#2a2200;--paper:#eef2ec;--tool:#e2e8df;--field:#fff;--soft:#e1ebdf;--hover:#dde8da;--line:#c6d1c3;--text:#172218;--mut:#5d705f;--bar:#0a140f;--bart:#dbe8de}
html[data-theme=rose]{--ink:#2a1520;--glow:#5a2a45;--deep:#4a2038;--tbi:#5a3149;--acc:#b04a7a;--acc2:#ffb08a;--acc2t:#3a1500;--paper:#f6eef1;--tool:#ecdfe5;--field:#fff;--soft:#f0e1e8;--hover:#ecdce4;--line:#d8c4cd;--text:#2a1720;--mut:#7a5c6a;--bar:#1a0c13;--bart:#f0dde6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);user-select:none}
body{background:radial-gradient(900px 600px at 85% 10%,var(--glow) 0,transparent 60%),var(--ink)}
body:not(.desk-on) #icons,body:not(.desk-on) #bar,body:not(.desk-on) #start,body:not(.desk-on) .win{display:none}
input,textarea,button,select{font:inherit}
.m{color:var(--mut);font-size:12px}
/* desktop */
#icons{position:absolute;left:12px;top:12px;height:calc(100% - 64px);display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,78px);grid-auto-columns:84px;gap:4px;align-content:start}
.icon{width:84px;height:74px;padding:6px 4px;text-align:center;color:#f1f6f7;border-radius:6px;cursor:pointer;border:1px solid transparent;background:none}
.icon:hover,.icon:focus-visible{background:#ffffff14;border-color:#ffffff22;outline:none}
.icon b{display:block;font-size:28px;font-weight:400;line-height:1.2}.icon span{font-size:12px}
.win{position:absolute;display:flex;flex-direction:column;min-width:260px;min-height:160px;background:var(--paper);color:var(--text);border:1px solid #0008;border-radius:8px;box-shadow:0 18px 40px #0007;overflow:hidden;resize:both}
.win.max{inset:0 0 44px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;height:34px;background:var(--tbi);color:#fff;cursor:move;flex:none;border-bottom:2px solid var(--tbi);touch-action:none}
.win.on .tb{background:var(--deep);border-bottom-color:var(--acc2)}
.tb .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:30px;height:26px;border:0;border-radius:4px;background:none;color:#fff;font-size:16px;cursor:pointer}
.tb button:hover{background:#ffffff26}.tb button.x:hover{background:#c0392b}
.body{flex:1;min-height:0;display:flex;flex-direction:column;user-select:text;overflow:hidden}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;gap:4px;align-items:center;padding:0 6px;background:var(--bar);color:var(--bart);border-top:1px solid #ffffff1a;z-index:99999}
#bar .go{background:var(--acc2);color:var(--acc2t);border:0;border-radius:5px;height:32px;padding:0 14px;font-weight:700;cursor:pointer}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
.task{max-width:160px;min-width:60px;height:32px;padding:0 10px;border:0;border-radius:5px;background:#ffffff14;color:var(--bart);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.task.on{background:#ffffff2e;box-shadow:inset 0 -2px var(--acc2)}
#clock{padding:0 8px;text-align:right;font-size:12px;line-height:1.2}
#start{position:fixed;left:6px;bottom:50px;width:230px;max-height:calc(100vh - 60px);overflow:auto;padding:6px;background:var(--bar);color:var(--bart);border:1px solid #ffffff22;border-radius:8px;z-index:99999;display:none}
#start.open{display:block}
#start button{display:flex;gap:10px;width:100%;padding:7px 10px;border:0;background:none;color:inherit;border-radius:5px;text-align:left;cursor:pointer}
#start button:hover{background:#ffffff1c}#start hr{border:0;border-top:1px solid #ffffff1c;margin:4px 0}
/* shared controls */
.tool{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--line);background:var(--tool);align-items:center}
.btn, a.btn{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:5px;padding:4px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.red{background:#b3392f;color:#fff;border-color:#b3392f}
.in{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--field);color:var(--text);min-width:0}
.list{flex:1;overflow:auto}
.row{display:flex;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hover)}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .m{color:var(--mut)}
.row .d{border:0;background:none;color:#d05a50;cursor:pointer;font-size:16px}
textarea.pad{flex:1;border:0;padding:10px;resize:none;outline:none;background:var(--field);color:var(--text);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--field)}
.msg{max-width:85%;padding:6px 10px;border-radius:8px;background:var(--soft);align-self:flex-start;word-break:break-word}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end}.msg small{display:block;color:var(--mut);font-size:11px}.msg.me small{color:#ffffffb8}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;flex:1}
.calc output{grid-column:1/-1;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:8px 10px;text-align:right;font-size:22px;overflow:hidden}
.calc button{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:6px;font-size:18px;cursor:pointer}
.calc button.op{background:var(--soft)}.calc button.eq{background:var(--acc2);color:var(--acc2t);border-color:var(--acc2)}
.term{flex:1;overflow:auto;background:#0b1418;color:#c8e6d4;padding:8px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.term .ln{display:flex;gap:6px}.term input{flex:1;background:none;border:0;outline:none;color:#fff;font:inherit;padding:0}
.sys{padding:14px;display:grid;gap:12px;overflow:auto}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc);transition:width .5s}
.sys dl{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;margin:0}.sys dt{color:var(--mut)}.sys dd{margin:0}
canvas.paint{flex:1;min-height:0;width:100%;background:#fff;touch-action:none;cursor:crosshair}
/* settings */
.set{flex:1;display:flex;min-height:0}
.nav{width:130px;flex:none;background:var(--tool);border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;padding:7px 10px;border:0;border-radius:5px;background:none;color:var(--text);cursor:pointer}
.nav button.on{background:var(--soft);font-weight:600}
.pane{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.pane h3,.pane p,.setup h2,.setup p{margin:0}.pane h3{font-size:16px}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sw{display:grid;gap:6px;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);cursor:pointer;text-align:left}
.sw.on{border-color:var(--acc2)}.chips{display:flex;height:22px;border-radius:4px;overflow:hidden}.chips span{flex:1}
.danger{border:1px solid #b3392f;border-radius:8px;padding:12px;display:grid;gap:8px}
.err{color:#e0584d;margin:0;min-height:1.2em;font-size:13px}.ok{color:#3f9d63;margin:0;min-height:1.2em;font-size:13px}
.f{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.btns{display:flex;justify-content:space-between;gap:8px}
/* full-screen states: boot, setup, login, off */
#screen{position:fixed;inset:0;z-index:1000000;display:none;align-items:center;justify-content:center;user-select:none}
#screen.on{display:flex}
#screen.black{background:#000;color:#cfd8dc}
#screen.setupbg{background:radial-gradient(900px 600px at 80% 10%,var(--glow) 0,transparent 60%),var(--ink)}
.boot{display:grid;gap:18px;justify-items:center;color:#e8eef0}
.boot h1{margin:0;font-size:30px;letter-spacing:.04em;font-weight:700;animation:rise .8s both}
.boot p{margin:0;color:#8a979c;font-size:13px;height:1.2em}
.logo{display:grid;grid-template-columns:repeat(2,26px);gap:6px}
.logo i{width:26px;height:26px;border-radius:5px;background:#26323a;animation:lit 1.6s infinite}
.logo i:nth-child(2){animation-delay:.2s}.logo i:nth-child(4){animation-delay:.4s}.logo i:nth-child(3){animation-delay:.6s}
.prog{width:220px;height:4px;background:#ffffff1f;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc2);transition:width .6s ease}
.setup .prog{background:var(--line);width:100%}
@keyframes lit{0%,100%{background:#26323a}30%,60%{background:var(--acc2)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.setup{width:min(430px,92vw);max-height:92vh;overflow:auto;background:var(--paper);color:var(--text);border-radius:10px;padding:24px;box-shadow:0 20px 50px #0008;display:grid;gap:12px;user-select:text}
.setup h2{font-size:20px}
ul.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.steps li::before{content:'○';margin-right:8px;color:var(--mut)}
ul.steps li.cur::before{content:'◐';color:var(--acc2)}ul.steps li.done::before{content:'●';color:var(--acc)}
.login{width:min(320px,90vw);display:grid;gap:12px;text-align:center;justify-items:center;color:#f1f6f7}
.login h2{margin:0}.login .in,.login .btn.pri{width:100%}.login .btns{width:100%}
.av{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:600}
.msgscr{display:grid;gap:10px;justify-items:center;text-align:center;max-width:420px;padding:20px}.msgscr h2,.msgscr p{margin:0}
.msgscr p{color:#9aa7ac}
.off{display:grid;gap:14px;justify-items:center}
.dot{display:inline-block;width:10px;height:10px;margin:0 5px;border-radius:50%;border:1px solid #333}.dot.on{background:#8a949a;border-color:#8a949a}
.hint{margin:0;color:#4b555a;font-size:13px}
@media (prefers-reduced-motion:reduce){.logo i,.boot h1{animation:none}.prog i{transition:none}}
@media (max-width:700px){.nav{width:104px}}

/* ---------- LanPC App Store (add-on) ---------- */
.store{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--field);color:var(--text)}
.storebar{display:flex;gap:7px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--tool);flex-wrap:wrap}
.storebar .in{flex:1;min-width:150px}
.storetabs{display:flex;gap:5px;padding:8px 8px 0;background:var(--tool)}
.storetab{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:6px 6px 0 0;padding:6px 12px;cursor:pointer}
.storetab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.storegrid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;align-content:start}
.storecard{border:1px solid var(--line);border-radius:9px;background:var(--field);padding:10px;display:grid;gap:7px;box-shadow:0 2px 8px #0001}
.storecard .shead{display:flex;gap:9px;align-items:center}
.storecard .sicon{font-size:34px;width:42px;text-align:center}
.storecard h3{margin:0;font-size:15px}
.storecard p{margin:0;color:var(--mut);font-size:12px;min-height:34px}
.storecard .smeta{display:flex;justify-content:space-between;color:var(--mut);font-size:11px}
.storecard .sactions{display:flex;gap:6px}
.storecard .sactions .btn{flex:1}
.storeempty{padding:20px;color:var(--mut);text-align:center;grid-column:1/-1}
.gamepad{display:grid;gap:8px;padding:10px;overflow:auto;flex:1}
.gamegrid{display:grid;gap:6px;justify-content:center}
.gamecell{width:58px;height:58px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);font-size:24px;cursor:pointer}
.gamecell:hover{background:var(--hover)}
.gameinfo{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.gamecanvas{display:block;margin:auto;max-width:100%;background:#081015;border:1px solid var(--line);touch-action:none}
.gamekeys{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.gamekeys button{min-width:44px;height:38px}
.todoitem{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.todoitem span{flex:1}.todoitem.done span{text-decoration:line-through;color:var(--mut)}
.clockbig{text-align:center;font-size:42px;font-weight:700;padding:25px 10px 5px}
.clockdate{text-align:center;color:var(--mut);padding-bottom:18px}
.colorpreview{height:130px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700}


.mediasplit{flex:1;min-height:0;display:flex}
.medialist{width:220px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--tool)}
.mediarow{display:flex;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);padding:8px 10px;cursor:pointer}
.mediarow.on,.mediarow:hover{background:var(--hover)}
.mediarow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mediastage{flex:1;min-width:0;display:grid;place-items:center;background:#111;overflow:auto}
.mediastage img,.mediastage video{max-width:100%;max-height:100%}
.mediastage audio{width:min(420px,90%)}
.mediaempty,.nowplay{color:#ddd;padding:20px;text-align:center;display:grid;gap:10px;justify-items:center}
.disc{width:92px;height:92px;border-radius:50%;background:conic-gradient(#2c6e73,#f0a73a,#2c6e73);display:grid;place-items:center;font-size:28px}
.aisplit{flex:1;min-height:0;display:flex}
.aiside{width:180px;flex:none;overflow:auto;background:var(--tool);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px}
.airow{display:flex;gap:6px;align-items:center;text-align:left;border:0;background:none;color:var(--text);padding:6px 8px;border-radius:5px;cursor:pointer}
.airow.on,.airow:hover{background:var(--hover)}
.airow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.airow i{font-style:normal;color:#d05a50}
.aicol{flex:1;min-width:0;display:flex;flex-direction:column}
.vscode{flex:1;min-height:0;display:flex;background:#1e1e1e;color:#d4d4d4}
.vact{width:42px;flex:none;background:#333;display:flex;flex-direction:column;gap:4px;padding:6px 4px}
.vact button{border:0;background:none;color:#fff;font-size:18px;height:34px;border-radius:5px;cursor:pointer}
.vact button:hover{background:#ffffff22}
.codeside{width:230px;flex:none;background:#252526;border-right:1px solid #111;display:flex;flex-direction:column;min-height:0}
.filepane,.aipane{flex:1;min-height:0;display:flex;flex-direction:column}
.codetree{flex:1;overflow:auto}
.coderow{display:block;width:100%;text-align:left;border:0;background:none;color:#ccc;padding:4px 8px;cursor:pointer}
.coderow:hover{background:#2a2d2e}
.vedit{flex:1;min-width:0;display:flex;flex-direction:column}
.codetabs{display:flex;gap:2px;overflow:auto;flex:1}
.codetab{border:0;background:#2d2d2d;color:#ccc;padding:4px 8px;border-radius:4px;cursor:pointer;white-space:nowrap}
.codetab.on{background:#1e1e1e;color:#fff}
.codetab i{font-style:normal;margin-left:6px;color:#888}
.codewrap{flex:1;min-height:0;display:flex;background:#1e1e1e}
.gutter{width:42px;flex:none;overflow:hidden;text-align:right;padding:8px 6px;color:#858585;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#1e1e1e}
.codepad{flex:1;border:0;resize:none;outline:none;background:#1e1e1e;color:#d4d4d4;padding:8px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.codestatus{display:flex;gap:14px;justify-content:flex-end;background:#007acc;color:#fff;font-size:12px;padding:2px 10px}
.previewpane{position:absolute;inset:34px 0 0 0;background:var(--paper);display:flex;flex-direction:column;z-index:3}
.preview{flex:1;border:0;background:#fff}
.cardface{margin:16px;min-height:120px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:16px;text-align:center;background:var(--field);font-size:18px}
.g2048{display:grid;grid-template-columns:repeat(4,64px);gap:6px;justify-content:center;padding:10px}
.t2048{height:64px;border-radius:6px;display:grid;place-items:center;background:#c7b8a3;font-weight:700}
.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179}.t16{background:#f59563}.t32{background:#f67c5f}.t64{background:#f65e3b;color:#fff}.t128,.t256,.t512,.t1024,.t2048{background:#edcf72}
.minegrid{display:grid;grid-template-columns:repeat(9,32px);gap:3px;justify-content:center;padding:10px}
.minecell{height:32px;border:1px solid var(--line);background:var(--soft);cursor:pointer}
.minecell.open{background:var(--field)}
.minecell.mine{background:#e7a}
.keygrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:8px}
.simongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.simon{height:90px;border:0;border-radius:10px;cursor:pointer}
.reactbox{margin:16px;height:160px;border:0;border-radius:10px;background:#2c6e73;color:#fff;font-size:22px;cursor:pointer}
.molegrid{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center;padding:10px}
.mole{height:70px;border-radius:40px;border:1px solid var(--line);background:var(--soft);font-size:26px;cursor:pointer}
.c4{display:flex;gap:4px;justify-content:center;padding:10px}
.c4col{display:flex;flex-direction:column-reverse;gap:4px;border:0;background:#24505a;padding:4px;border-radius:6px;cursor:pointer}
.c4col i{width:28px;height:28px;border-radius:50%;background:#d7e3e6;display:block}
.c4col i.red{background:#e85d5d}.c4col i.yel{background:#f0a73a}

.browserframe{flex:1;width:100%;border:0;background:#fff;min-height:0}
</style>
</head>
<body>
<div id="icons"></div>
<div id="start"></div>
<div id="bar"><button class="go" id="gobtn">Apps</button><div id="tasks"></div><div id="clock"></div></div>
<div id="screen"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, ...k) => {
  const e = document.createElement(t);
  for (const [x, v] of Object.entries(a)) x.startsWith('on') ? e.addEventListener(x.slice(2), v) : x === 'class' ? e.className = v : e.setAttribute(x, v);
  k.flat().forEach(c => e.append(c)); return e;
};
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function openApp(app, opts = {}) {
  const id = ++wid;

  const close = () => { w.cleanup && w.cleanup(); win.remove(); w.task.remove(); wins.delete(w); };
  w.close = close;
  const minimize = () => { win.classList.add('min'); w.task.classList.remove('on'); win.classList.remove('on'); };
  const toggleMax = () => win.classList.toggle('max');
  const tb = el('div', { class: 'tb', ondblclick: toggleMax }, title,
    el('button', { title: 'Minimize', onclick: e => { e.stopPropagation(); minimize(); } }, '–'),
    el('button', { title: 'Maximize', onclick: e => { e.stopPropagation(); toggleMax(); } }, '□'),
    el('button', { class: 'x', title: 'Close', onclick: e => { e.stopPropagation(); close(); } }, '×'));

  win.addEventListener('pointerdown', () => focusWin(w));
  tb.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || win.classList.contains('max')) return;
    const dx = e.clientX - win.offsetLeft, dy = e.clientY - win.offsetTop;
    tb.setPointerCapture(e.pointerId);
    const mv = ev => { win.style.left = Math.max(-200, ev.clientX - dx) + 'px'; win.style.top = Math.max(0, Math.min(innerHeight - 80, ev.clientY - dy)) + 'px'; };
    const up = () => { tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up); };

  w.setTitle = t => { title.textContent = app.icon + '  ' + t; w.task.textContent = t; };

}

/* ---------- Media, files, AI hub, code workspace, extra store ---------- */
const IMG_RE = /\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i;
const VID_RE = /\.(mp4|webm|ogv|mov|m4v)$/i;
const AUD_RE = /\.(mp3|wav|ogg|m4a|flac|aac)$/i;
const MEDIA_RE = /\.(png|jpe?g|gif|webp|svg|bmp|ico|mp4|webm|ogv|mov|m4v|mp3|wav|ogg|m4a|flac|aac)$/i;

async function walkFiles(path, acc) {
  acc = acc || [];
  const items = await (await api('/api/files?path=' + encodeURIComponent(path || ''))).json();
  for (const i of items) {
    const p = join(path || '', i.name);
    if (i.dir) await walkFiles(p, acc);
    else acc.push({ name: i.name, path: p, size: i.size, mtime: i.mtime });
  }
  return acc;
}
function mediaKind(name) {
  if (IMG_RE.test(name)) return 'image';
  if (VID_RE.test(name)) return 'video';
  if (AUD_RE.test(name)) return 'audio';
  return '';
}

function orKey() { return localStorage.getItem('lanpc.openrouter.key') || ''; }
function orModel() { return localStorage.getItem('lanpc.openrouter.model') || 'openrouter/auto'; }
const OR_MODELS = ['openrouter/auto', 'openai/gpt-4o-mini', 'openai/gpt-4.1-mini', 'anthropic/claude-3.5-sonnet', 'google/gemini-2.0-flash-001', 'meta-llama/llama-3.3-70b-instruct', 'deepseek/deepseek-chat', 'qwen/qwen-2.5-coder-32b-instruct'];
async function orComplete(messages, onDelta, model) {
  const key = orKey();
  if (!key) throw new Error('Add an OpenRouter API key first.');
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin, 'X-Title': 'LanPC' },
    body: JSON.stringify({ model: model || orModel(), messages, stream: true })
  });
  if (!r.ok) throw new Error((await r.text()).slice(0, 400) || ('OpenRouter ' + r.status));
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      const s = line.trim(); if (!s.startsWith('data:')) continue;
      const data = s.slice(5).trim(); if (data === '[DONE]') return full;
      try { const d = JSON.parse(data).choices?.[0]?.delta?.content || ''; if (d) { full += d; onDelta && onDelta(d, full); } } catch (e) {}
    }
  }
  return full;
}

  const k = prompt('OpenRouter API key (stored only in this browser):', orKey());

  localStorage.setItem('lanpc.openrouter.key', k.trim());

}

function makeBrowser(body, startUrl) {
  const addr = el('input', { class: 'in', style: 'flex:1', placeholder: 'Search or enter a URL', spellcheck: 'false' });
  const frame = el('iframe', { class: 'browserframe' });
  const status = el('span', { class: 'm' });
  const fallback = el('div', { class: 'mediaempty', style: 'display:none' });
  const hist = []; let at = -1;
  const searchUrl = q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
  const normalize = raw => {
    const v = (raw || '').trim();
    if (!v) return '';
    if (/^https?:\/\//i.test(v)) return v;
    if (v.includes(' ') || !v.includes('.')) return searchUrl(v);
    return 'https://' + v;
  };
  const needsWindow = url => /youtube\.com|youtu\.be|crazygames\.com|dosgames\.com|accounts\.google\.com/i.test(url);
  const outside = url => window.open(url, '_blank', 'noopener,noreferrer');
  const showOutside = url => {
    frame.style.display = 'none';
    fallback.style.display = 'grid';
    fallback.replaceChildren(
      el('b', {}, 'This site will not run inside the LanPC window'),
      el('p', {}, 'YouTube, Crazy Games and DOOM block embedded players. Open them in a normal browser window.'),
      el('button', { class: 'btn pri', onclick: () => outside(url) }, 'Open site'));
    status.textContent = 'Opened outside LanPC';
  };
  const go = (raw, push = true) => {
    const url = normalize(raw);
    if (!url) return;
    addr.value = url;
    if (push) { hist.splice(at + 1); hist.push(url); at = hist.length - 1; }
    if (needsWindow(url)) { showOutside(url); outside(url); return; }
    fallback.style.display = 'none';
    frame.style.display = 'block';
    status.textContent = 'Loading…';
    frame.src = url;
  };
  frame.addEventListener('load', () => { status.textContent = ''; });
  addr.onkeydown = e => { if (e.key === 'Enter') go(addr.value); };
  body.append(el('div', { class: 'tool' },
    el('button', { class: 'btn', title: 'Back', onclick: () => { if (at > 0) { at--; go(hist[at], false); } } }, '←'),
    el('button', { class: 'btn', title: 'Forward', onclick: () => { if (at < hist.length - 1) { at++; go(hist[at], false); } } }, '→'),
    el('button', { class: 'btn', title: 'Reload', onclick: () => go(addr.value || startUrl, false) }, '↻'),
    addr,
    el('button', { class: 'btn pri', onclick: () => go(addr.value) }, 'Go'),
    el('button', { class: 'btn', onclick: () => outside(normalize(addr.value) || startUrl) }, 'Open outside'),
    status), fallback, frame);
  go(startUrl || 'https://duckduckgo.com/');
}

// ---------- Full-screen states ----------
const scr = $('#screen');
const show = (node, cls = '') => { scr.className = 'on ' + cls; scr.replaceChildren(node); };
const hideScreen = () => { scr.className = ''; scr.replaceChildren(); };
const msgScreen = (title, text, ...btns) => show(el('div', { class: 'msgscr' }, el('h2', {}, title), el('p', {}, text), btns), 'black');
const serverDown = () => msgScreen("Can't reach LanPC", 'The server is not responding. Check that it is running on the host machine.', el('button', { class: 'btn', onclick: boot }, 'Try again'));

function bootAnim() {
  const bar = el('i'), msg = el('p', {});
  show(el('div', { class: 'boot' }, el('div', { class: 'logo' }, el('i'), el('i'), el('i'), el('i')), el('h1', {}, 'LanPC'), el('div', { class: 'prog' }, bar), msg), 'black');
  const steps = ['Starting network', 'Mounting shared drive', 'Loading apps', 'Preparing desktop'];
  return new Promise(res => {
    let i = 0;
    const tick = () => { if (i >= steps.length) return setTimeout(res, 300); msg.textContent = steps[i] + '…'; bar.style.width = ((i + 1) / steps.length * 100) + '%'; i++; setTimeout(tick, 700); };
    setTimeout(tick, 500);
  });
}

async function boot() {
  clearSession();
  if (localStorage.getItem('off') === '1') return powerOffScreen();
  const [st] = await Promise.all([fetchStatus(), bootAnim()]);
  if (!st) return serverDown();
  if (!st.installed) return installer();
  applyTheme(st.theme);
  st.authed ? enterDesktop(st) : login(st);
}

function enterDesktop(st) {
  applyTheme(st.theme); acct = st.user; me = (localStorage.getItem('name') || st.user || 'guest').slice(0, 24);
  loadUserApps().then(() => { buildStart(); refreshStoreDesktop(); });
  hideScreen(); document.body.classList.add('desk-on');
}

function login(st) {
  const p = el('input', { class: 'in', type: 'password', placeholder: 'Password', autocomplete: 'current-password' }), err = el('p', { class: 'err' });
  const go = async () => {
    err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', body: JSON.stringify({ password: p.value }) });
      if (!r.ok) throw new Error(r.status === 403 ? 'Wrong password.' : await r.text());
      setToken((await r.json()).token); enterDesktop(st);
    } catch (e) { err.textContent = e.message; p.select(); }
  };
  p.onkeydown = e => { if (e.key === 'Enter') go(); };
  show(el('div', { class: 'login' }, el('div', { class: 'av' }, (st.user || '?')[0].toUpperCase()), el('h2', {}, st.user), p, err,
    el('button', { class: 'btn pri', onclick: go }, 'Sign in'),
    el('div', { class: 'btns' }, el('button', { class: 'btn', onclick: restart }, 'Restart'), el('button', { class: 'btn', onclick: shutdown }, 'Shut down'))), 'setupbg');
  setTimeout(() => p.focus(), 50);
}

function installer() {
  const d = { user: 'admin', pw: '', theme: localStorage.getItem('theme') || 'teal' };
  const card = (...k) => show(el('div', { class: 'setup' }, ...k), 'setupbg');
  const field = (label, input) => el('label', { class: 'f' }, label, input);
  const welcome = () => card(el('h2', {}, 'Welcome to LanPC'),
    el('p', {}, 'This is the first start on this machine. Setup creates your account and prepares the shared drive. It takes about a minute.'),
    el('div', { class: 'btns' }, el('span'), el('button', { class: 'btn pri', onclick: account }, 'Get started')));
  const account = () => {
    const u = el('input', { class: 'in', value: d.user, maxlength: 24 }), p = el('input', { class: 'in', type: 'password', placeholder: 'At least 4 characters' }), c = el('input', { class: 'in', type: 'password' }), err = el('p', { class: 'err' });
    const next = () => {
      if (!u.value.trim()) return err.textContent = 'Enter a user name.';
      if (p.value.length < 4) return err.textContent = 'Use a password with at least 4 characters.';
      if (p.value !== c.value) return err.textContent = 'The passwords do not match.';
      d.user = u.value.trim(); d.pw = p.value; themeStep();
    };
    card(el('h2', {}, 'Create your account'), field('User name', u), field('Password', p), field('Confirm password', c), err,
      el('div', { class: 'btns' }, el('button', { class: 'btn', onclick: welcome }, 'Back'), el('button', { class: 'btn pri', onclick: next }, 'Next')));
    [u, p, c].forEach(i => i.onkeydown = e => { if (e.key === 'Enter') next(); }); u.focus();
  };
  const themeStep = () => card(el('h2', {}, 'Choose a theme'), el('p', { class: 'm' }, 'You can change it later in Settings.'),
    themeGrid(d.theme, k => { d.theme = k; applyTheme(k); }),
    el('div', { class: 'btns' }, el('button', { class: 'btn', onclick: account }, 'Back'), el('button', { class: 'btn pri', onclick: installing }, 'Install')));
  const installing = async () => {
    const steps = ['Creating your account', 'Preparing the shared drive', 'Writing system files', 'Applying your theme'];
    const list = el('ul', { class: 'steps' }, steps.map(s => el('li', {}, s))), bar = el('i'), status = el('p', { class: 'err' });
    const cardEl = el('div', { class: 'setup' }, el('h2', {}, 'Installing LanPC'), list, el('div', { class: 'prog' }, bar), status);
    show(cardEl, 'setupbg');
    const req = fetch('/api/install', { method: 'POST', body: JSON.stringify({ user: d.user, password: d.pw, theme: d.theme }) })
      .then(async r => { if (!r.ok) throw new Error(await r.text()); });
    const lis = [...list.children];
    const anim = new Promise(res => {
      let i = 0;
      const t = () => { if (i > 0) { lis[i - 1].classList.remove('cur'); lis[i - 1].classList.add('done'); } if (i >= lis.length) return res(); lis[i].classList.add('cur'); bar.style.width = ((i + 1) / lis.length * 100) + '%'; i++; setTimeout(t, 900); };
      t();
    });
    try { await Promise.all([req, anim]); }
    catch (e) { status.textContent = 'Setup failed: ' + e.message; cardEl.append(el('div', {}, el('button', { class: 'btn', onclick: account }, 'Go back'))); return; }
    cardEl.replaceChildren(el('h2', {}, 'Setup complete'), el('p', {}, 'LanPC is installed. Restart to sign in with your new account.'),
      el('div', {}, el('button', { class: 'btn pri', onclick: restart }, 'Restart now')));
  };
  welcome();
}

  const press = () => {
    n++; dots.forEach((x, i) => x.classList.toggle('on', i < n));
    if (n >= 3) { off(); localStorage.removeItem('off'); setTimeout(boot, 250); }
  };
  const key = e => { if (e.key === 'Enter') { e.preventDefault(); press(); } };
  const tap = e => { if (e.pointerType === 'touch') press(); };   // touch screens have no Enter key
  const off = () => { removeEventListener('keydown', key); scr.removeEventListener('pointerdown', tap); };
  addEventListener('keydown', key); scr.addEventListener('pointerdown', tap);
}

function restart() { clearSession(); msgScreen('Restarting…', ''); setTimeout(boot, 1300); }
function shutdown() { clearSession(); localStorage.setItem('off', '1'); msgScreen('Shutting down…', ''); setTimeout(powerOffScreen, 1300); }
async function stopServer() {
  if (!confirm('Stop the LanPC server?\n\nEvery device loses access until you start it again on the host machine.')) return;
  try { await post('/api/shutdown'); } catch (e) { alert(e.message); return; }
  clearSession();
  msgScreen('Server stopped', 'The LanPC server has been shut down. To use it again, start it on the host machine with python server.py, then reload this page.',
    el('button', { class: 'btn', onclick: () => location.reload() }, 'Reload'));
}

// ---------- Desktop shell ----------
const launchers = ['files', 'browser', 'crazy', 'doom', 'media', 'notepad', 'code', 'ai', 'chat', 'term', 'calc', 'paint', 'sys', 'settings', 'store'];
launchers.forEach(k => $('#icons').append(el('button', { class: 'icon', onclick: () => openApp(Apps[k]) }, el('b', {}, Apps[k].icon), el('span', {}, Apps[k].name))));
const start = $('#start');
function buildStart() {
  const close = f => () => { start.classList.remove('open'); f(); };
  start.replaceChildren(...launchers.map(k => el('button', { onclick: close(() => openApp(Apps[k])) }, Apps[k].icon, Apps[k].name)),
    ...storeInstalled().map(id => {
      const a = id.startsWith('user:') ? userApp(id.slice(5)) : StoreApps[id];
      return a ? el('button', { onclick: close(() => openApp(a)) }, a.icon, a.name) : null;
    }), el('hr'),
    el('button', { onclick: close(() => openApp(Apps.settings, { tab: 'Account' })) }, '👤', 'Signed in as ' + me), el('hr'),
    el('button', { onclick: close(restart) }, '🔄', 'Restart'),
    el('button', { onclick: close(shutdown) }, '⏻', 'Shut down'),
    el('button', { onclick: close(stopServer) }, '🛑', 'Stop server'));
}
$('#gobtn').onclick = e => { e.stopPropagation(); start.classList.toggle('open'); };
document.addEventListener('pointerdown', e => { if (!start.contains(e.target)) start.classList.remove('open'); });
const clock = () => { const d = new Date(); $('#clock').innerHTML = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '<br>' + d.toLocaleDateString([], { day: 'numeric', month: 'short' }); };
clock(); setInterval(clock, 15000);

boot();
</script>
</body>
